[project]
name = "maap-eoapi"
version = "0.0"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib==2.263.0",
    "constructs==10.8.0",
    "eoapi-cdk>=11.6.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
]

[tool.uv.sources]
dps-stac-item-generator = { path = "cdk/constructs/DpsStacItemGenerator/runtime" }
eoapi-raster = { path = "cdk/runtimes/eoapi/raster" }
eoapi-stac = { path = "cdk/runtimes/eoapi/stac" }


[dependency-groups]
dev = [
    "aws-lambda-typing>=2.20.0",
    "boto3>=1.43.62",
    "pytest>=9.1.1",
    "pystac[validation]>=1.15.2",
    "requests>=2.31",
]


[tool.uv]
no-build-isolation-package = ["numexpr"]

[tool.ruff]

[tool.ruff.lint]
