[project]
name = "maap-eoapi"
version = "0.0"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib==2.266.0",
    "constructs==10.8.1",
    "eoapi-cdk>=11.7.1",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
dps-stac-item-generator = { path = "cdk/constructs/DpsStacItemGenerator/runtime" }
eoapi-raster = { path = "cdk/runtimes/eoapi/raster" }
eoapi-stac = { path = "cdk/runtimes/eoapi/stac" }


[dependency-groups]
dev = [
    "aws-lambda-typing>=2.20.0",
    "boto3>=1.43.42",
    "pytest>=9.1.1",
    "pystac[validation]>=1.15.2",
    "requests>=2.31",
    "pre-commit>=4.6.2",
]


[tool.uv]
no-build-isolation-package = ["numexpr"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "TID",  # flake8-tidy-imports
    "TC",   # flake8-type-checking
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
]
ignore = [
  "BLE001",  # Blind Exceptions
  "PTH",  # flake8-use-pathlib
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.markdownlint-cli2.config]
MD013 = false

[tool.ruff.lint.isort]
combine-as-imports = true
